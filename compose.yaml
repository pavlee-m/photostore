services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
      MSSQL_PID: Developer
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 2g
    restart: unless-stopped

  mssql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      mssql:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./docker/mssql/create-database.sql:/init/create-database.sql:ro
    entrypoint:
      [
        "/bin/bash",
        "-c",
        '/opt/mssql-tools18/bin/sqlcmd -S mssql -U sa -P "$$MSSQL_SA_PASSWORD" -C -i /init/create-database.sql',
      ]
    restart: "no"

  photostore:
    build: .
    ports:
      - "${APP_PORT:-8080}:8080"
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: "jdbc:sqlserver://mssql:1433;databaseName=photostore;encrypt=true;trustServerCertificate=true"
    volumes:
      - photostore-storage:/app/storage
      - photostore-profiles:/app/profile_pictures
      - photostore-covers:/app/album_covers
      - photostore-chunks:/app/chunks
    depends_on:
      mssql:
        condition: service_healthy
      mssql-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  mssql-data:
  photostore-storage:
  photostore-profiles:
  photostore-covers:
  photostore-chunks:
