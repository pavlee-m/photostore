spring.application.name=photostore

# Local secrets: copy .env.example to .env (gitignored).
# Plug in another file with: ENV_FILE=.env.staging ./mvnw spring-boot:run
spring.config.import=optional:file:${ENV_FILE:.env}[.properties]

spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=photostore;encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.default_schema=photostore
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET}

# 1 hour
jwt.expiration=3600000
# 30 days
jwt.refresh.expiration=2592000000

# 1 minute
# jwt.expiration=60000

# 3 minutes
# jwt.refresh.expiration=180000

photostore.max-file-size=5GB
photostore.allowed-file-extensions-image=jpg,jpeg,png,bmp,gif
photostore.allowed-file-extensions-video=mp4
photostore.profile_pictures_directory=./profile_pictures/
photostore.album_covers_directory=./album_covers/
photostore.storage_directory=./storage/
photostore.thumbnails_directory=./thumbnails/
photostore.chunks_directory=./chunks/
# 24 hours
photostore.upload-session-ttl=24h
photostore.master_key=${PHOTO_STORE_MASTER_KEY}


photostore.storage_max_size_mb=102400
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB
spring.servlet.multipart.file-size-threshold=0
spring.servlet.multipart.resolve-lazily=true